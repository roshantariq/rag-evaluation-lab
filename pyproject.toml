[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rageval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "arxiv", "pymupdf", "pdfplumber",
  "langchain", "langchain-openai",
  # Pinned: langchain-community 0.4.2 removed chat_models.vertexai,
  # which ragas imports at module load. See docs/dependencies.md
  "langchain-community==0.4.1",
  "chromadb", "sentence-transformers", "rank-bm25",
  "openai", "ragas", "mlflow", "requests",
  # Undeclared transitive dependency of ragas
  "pillow",
  "pandas", "numpy", "matplotlib", "pyyaml",
  "python-dotenv", "tqdm", "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100