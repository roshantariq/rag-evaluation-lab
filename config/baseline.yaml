# The baseline every later ablation is measured against. It changes only
# when the baseline itself is redefined.
#
# Redefined by sweep 2: retrieval.mode dense -> bm25. BM25 beat dense by
# +0.168 span recall at the 20k budget, CI [+0.082, +0.253], Holm p = 0.0069,
# selected in 93.2% of half-splits — both halves of the pre-registered
# switching rule. The effect size is bounded by the authoring confound
# (docs/build-log.md, sweep 2). The Phase 5 dense version is preserved as
# config/dense_phase5.yaml.
#
# results/tables/retrieval_baseline.csv holds the Phase 5 DENSE run, not
# this configuration. The `baseline` tag must never be overwritten; give
# runs of this config their own tag (the BM25 run is `bm25`).
# 10_eval_retrieval.py defaults to --tag baseline, so always pass --tag.
#
# retrieval.mode is read by 10_eval_retrieval.py and, since Phase 7, by
# RAGPipeline and 05_ask.py through rageval.retrieve.factory (dense | bm25).
# Generation's BM25 retrieval was checked against retrieval_bm25.csv: same
# spans found at k=10 and k=20 on all 58 questions. 04_search.py is still
# a dense-only ad-hoc tool.
#
# index.ef_search: 500 since 31 Oct 2026 (was Chroma's default 100, never
# chosen). Unused by BM25; it governs any dense search of this collection.
#
# retrieval.k is for generation only; the harness scores every k up to
# --k-max. Set to 20 by sweep 4 (docs/k-sweep-protocol.md): every step on
# the ladder 1->3->5->10->20 added evidence detectably under BM25, the last
# +0.059 [+0.020, +0.106], so 20 is the top of the ladder, not a plateau.
# It was 5 as a placeholder; Phase 5 found zero of 33 two-span questions
# with both spans retrieved at k=5 under dense retrieval.
chunking:
  strategy: fixed_512
  target_tokens: 512
  overlap_tokens: 0

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2   # builds the index; unused by bm25 retrieval

index:
  collection: baseline_fixed512_minilm
  ef_search: 500           # HNSW search depth, persisted in the collection; declared, never a library default

retrieval:
  mode: bm25              # dense | bm25 | hybrid  (was dense until sweep 2)
  k: 20                   # generation context; chosen by sweep 4

# Models are pinned to dated versions, not aliases, so a run that stops at
# the spend cap and resumes later queries the same model (Phase 7 protocol,
# amendment). Versions confirmed against the provider's model list,
# 30 Oct 2026; each answer also records the version that actually replied.
generation:
  provider: openai          # or "azure"
  model: gpt-4o-mini-2024-07-18
  temperature: 0.0          # determinism matters: ablations must be comparable
  max_tokens: 700
  prompt_strategy: abstain  # naive | abstain | abstain_confidence

evaluation:
  judge_model: gpt-4o-2024-08-06   # RAGAS faithfulness judge; not the generator
