# The deliberately unoptimised baseline. Every ablation is measured
# against this, so it changes only when the baseline itself is redefined.
chunking:
  strategy: fixed_512
  target_tokens: 512
  overlap_tokens: 0

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

index:
  collection: baseline_fixed512_minilm

retrieval:
  k: 5

generation:
  provider: openai          # or "azure"
  model: gpt-4o-mini
  temperature: 0.0          # determinism matters: ablations must be comparable
  max_tokens: 700
  prompt_strategy: abstain  # naive | abstain | abstain_confidence