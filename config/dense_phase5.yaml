# The Phase 5 dense baseline, preserved verbatim from baseline.yaml before
# sweep 2 redefined the baseline as BM25. Kept so the dense arm stays
# re-runnable by name.
#
# results/tables/retrieval_baseline.csv holds THIS run (dense, Phase 5),
# searched at ef_search 100, Chroma's default and never a choice. On
# 31 Oct 2026 the collection was set to 500, which on copies made HNSW
# identical to exact search and repeatable across processes for all 58
# questions at every depth to 50 (hnsw_check.csv). A run of this config
# now searches at 500; retrieval_baseline.csv stays as the record at 100.
# The `baseline` tag must never be overwritten: every Phase 5-6 comparison,
# the oracle ceiling and the truncation diagnostic read that file.
#
# retrieval.k is 5 for generation only; the harness scores every k up to
# --k-max. Generation needs k>5 (Phase 5: zero of 32 two-span questions had
# both spans retrieved at k=5). Sweep 4 decides the value.
chunking:
  strategy: fixed_512
  target_tokens: 512
  overlap_tokens: 0

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

index:
  collection: baseline_fixed512_minilm
  ef_search: 500           # HNSW search depth, persisted in the collection; declared, never a library default

retrieval:
  mode: dense             # dense | bm25 | hybrid
  k: 5                    # generation needs k>5; sweep 4 decides

generation:
  provider: openai          # or "azure"
  model: gpt-4o-mini
  temperature: 0.0          # determinism matters: ablations must be comparable
  max_tokens: 700
  prompt_strategy: abstain  # naive | abstain | abstain_confidence
