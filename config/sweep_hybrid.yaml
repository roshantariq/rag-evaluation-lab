# Sweep 2, arm 3: reciprocal rank fusion of dense and BM25.
#
# Same collection as baseline.yaml, deliberately. Both retrievers read the
# chunks already stored there, so chunking, extraction and chunk boundaries
# are byte-identical to the other two arms and the ONLY thing that differs
# is the retrieval function. Nothing needs re-indexing.
#
# Fusion constants live on the command line, not here, because they are
# declared per run and must appear in the run log: --rrf-k 60 --pool 100.
chunking:
  strategy: fixed_512
  target_tokens: 512
  overlap_tokens: 0

embedding:
  model: sentence-transformers/all-MiniLM-L6-v2

index:
  collection: baseline_fixed512_minilm

retrieval:
  mode: hybrid
  k: 5

generation:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 700
  prompt_strategy: abstain